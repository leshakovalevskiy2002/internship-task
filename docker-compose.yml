name: transactions-service-dev

services:
  api:
    build: .
    volumes:
      - ./app:/usr/src/app/app
    command: sh -c "alembic upgrade head && python -m app.main"
    ports:
      - "8000:7999"
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7999/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env.dev

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env.dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.2.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    volumes:
      - ./app:/usr/src/app/app
    command: dramatiq app.worker --processes 2 --threads 2 --queues reports
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    volumes:
      - ./app:/usr/src/app/app
    command: python -m app.scheduler.main
    env_file:
      - .env.dev
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data-dev:
  redis-data:
  rabbitmq_data:
