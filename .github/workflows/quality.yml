name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run isort
        run: poetry run isort --check-only --diff app tests

      - name: Run black
        run: poetry run black --check --diff app tests

      - name: Run mypy
        run: poetry run mypy app

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: transactions_test
          POSTGRES_PASSWORD: transactions_test
          POSTGRES_DB: transactions_service_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Verify Docker
        run: docker info

      - name: Create .env.test for tests
        run: cp .env.test.example .env.test

      - name: Run unit tests
        run: poetry run pytest -m "not integration"

      - name: Run integration tests
        run: poetry run pytest -m integration
