name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run isort
        run: poetry run isort --check-only --diff app tests

      - name: Run black
        run: poetry run black --check --diff app tests

      - name: Run mypy
        run: poetry run mypy app

      - name: Verify Docker
        run: docker info

      - name: Run unit tests
        run: poetry run pytest -m "not integration"

      - name: Run integration tests
        run: poetry run pytest -m integration
